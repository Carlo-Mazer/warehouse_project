<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warehouse 3.0</title>
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
    <link rel="stylesheet" href="custom-styles.css">
</head>
<body>

<div class="container box">
  <div class="columns">
    <div class="column col-3"></div>

    <div class="column col-6">

      <header class="navbar">
        <section class="navbar-section">
          <a href="index.html" class="navbar-brand mr-2">
            <div id="logo-header">Warehouse 3.0</div>
          </a>
          <a href="index.html" class="btn btn-link">Home</a>
          <a href="purchase.html" class="btn btn-link">Purchase</a>
          <a href="sale.html" class="btn btn-link">Sale</a>
          <a href="balance.html" class="btn btn-link">Balance</a>
          <a href="history.html" class="btn btn-link">History</a>
        </section>
      </header>

      <div class="hero bg-gray">
        <div class="hero-body">
          <h1>Accounting and Warehouse System</h1>
          <p>This application allows you to manage warehouse and account balance.</p>
        </div>
      </div>

      <div class="columns">
        <div class="column col-6">
          <div class="card">
            <div class="card-header">
              <h4>Current stock level</h4>
            </div>
            <div class="card-body">
              <p>Product: Keyboard</p>
              <p>Quantity: 20 pieces</p>
            </div>
          </div>
        </div>

        <div class="column col-6">
          <div class="card">
            <div class="card-header">
              <h4>Current account balance</h4>
            </div>
            <div class="card-body">
              <p>Balance: 5000 PLN</p>
            </div>
          </div>
        </div>
      </div>

      <div class="columns">
        <div class="column col-4">
          <a href="purchase.html" class="btn btn-primary btn-block">Purchase</a>
        </div>
        <div class="column col-4">
          <a href="sale.html" class="btn btn-primary btn-block">Sale</a>
        </div>
        <div class="column col-4">
          <a href="balance.html" class="btn btn-primary btn-block">Balance</a>
        </div>
      </div>

    </div>

    <div class="column col-3"></div>
  </div>
</div>

</body>
</html>
